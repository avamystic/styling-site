<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Booked | Style with Ava</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500&family=DM+Mono:wght@400&display=swap">

  <style>
    :root {
      --h-bg:     #0C0806;
      --h-orange: #E05500;
      --h-cream:  #F5EFE0;
      --h-muted:  rgba(245, 239, 224, 0.6);
      --h-line:   rgba(245, 239, 224, 0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      background-color: var(--h-bg);
      color: var(--h-cream);
      font-family: 'Archivo', Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    .thanks-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }

    .thanks-inner {
      max-width: 600px;
      width: 100%;
    }

    .thanks-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--h-orange);
      margin-bottom: 24px;
    }

    .thanks-heading {
      font-family: 'Marcellus', Georgia, serif;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.1;
      color: var(--h-cream);
      margin-bottom: 24px;
    }

    .thanks-sub {
      font-size: clamp(15px, 1.5vw, 17px);
      line-height: 1.7;
      color: var(--h-muted);
      margin-bottom: 40px;
    }

    .thanks-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 14px 28px;
      background-color: var(--h-orange);
      color: var(--h-bg);
      border: 1px solid var(--h-orange);
      transition: background-color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .thanks-btn:hover {
      background-color: #c44c00;
      border-color: #c44c00;
    }

    footer {
      border-top: 1px solid var(--h-line);
      padding: 32px 24px;
      text-align: center;
    }

    footer a {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--h-muted);
      transition: color 0.2s;
    }

    footer a:hover { color: var(--h-cream); }
  </style>
</head>

<body>
  <div class="thanks-wrap">
    <div class="thanks-inner">
      <p class="thanks-eyebrow">Halloween &middot; Style with Ava</p>
      <h1 class="thanks-heading">You're in.</h1>
      <p class="thanks-sub">The next step is choosing a time for your consultation.</p>
      <a
        href="https://calendly.com/avachannel/15min"
        class="thanks-btn"
        target="_blank"
        rel="noopener noreferrer"
      >Book your consultation</a>
    </div>
  </div>

  <footer>
    <a href="/">Back to Style with Ava</a>
    <p style="margin-top:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.04em;color:rgba(245,239,224,0.3);">Film photography by Ava Sharbaf.</p>
  </footer>
</body>
</html>
