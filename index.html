<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Season | Color Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #1a1a1a;
            --white: #ffffff;
            --off-white: #f8f6f3;
            --warm-gray: #e8e4df;
            --mid-gray: #9a9590;
            --dark-gray: #4a4745;
            --accent: #c4a87c;
            --spring-primary: #f5c542;
            --summer-primary: #7ba7c9;
            --autumn-primary: #c47a3f;
            --winter-primary: #3d4f7c;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--white);
            color: var(--black);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* NAV BAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            padding: 0 48px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        nav .logo {
            font-family: 'Playfair Display', serif;
            font-size: 13px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 400;
            color: var(--black);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 24px 80px;
            background: var(--off-white);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(196,168,124,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 50%, rgba(123,167,201,0.06) 0%, transparent 50%);
            animation: gentleDrift 20s ease-in-out infinite;
        }

        @keyframes gentleDrift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2%, 1%); }
        }

        .hero-label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--mid-gray);
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(42px, 7vw, 88px);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -1px;
            max-width: 800px;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .hero h1 em {
            font-style: italic;
            color: var(--accent);
        }

        .hero-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(18px, 2.5vw, 24px);
            font-weight: 300;
            color: var(--dark-gray);
            max-width: 540px;
            line-height: 1.6;
            margin-bottom: 48px;
            position: relative;
            z-index: 1;
        }

        .cta-button {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 18px 48px;
            background: var(--black);
            color: var(--white);
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            z-index: 1;
        }

        .cta-button:hover {
            background: var(--dark-gray);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        /* SEASON STRIP */
        .season-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            height: 6px;
        }

        .season-strip div:nth-child(1) { background: var(--spring-primary); }
        .season-strip div:nth-child(2) { background: var(--summer-primary); }
        .season-strip div:nth-child(3) { background: var(--autumn-primary); }
        .season-strip div:nth-child(4) { background: var(--winter-primary); }

        /* QUIZ SECTION */
        .quiz-section {
            display: none;
            min-height: 100vh;
            padding: 80px 24px;
        }

        .quiz-section.active {
            display: block;
        }

        .quiz-container {
            max-width: 720px;
            margin: 0 auto;
        }

        /* PROGRESS BAR */
        .progress-wrapper {
            margin-bottom: 64px;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--mid-gray);
        }

        .progress-count {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            color: var(--dark-gray);
        }

        .progress-bar {
            height: 2px;
            background: var(--warm-gray);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--black);
            transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* QUESTION */
        .question-block {
            animation: fadeUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            color: var(--mid-gray);
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .question-text {
            font-family: 'Playfair Display', serif;
            font-size: clamp(26px, 4vw, 36px);
            font-weight: 400;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .question-hint {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            color: var(--mid-gray);
            font-style: italic;
            margin-bottom: 48px;
        }

        /* OPTIONS */
        .options-grid {
            display: grid;
            gap: 16px;
        }

        .options-grid.visual {
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
        }

        .option {
            padding: 22px 28px;
            border: 1px solid var(--warm-gray);
            background: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .option:hover {
            border-color: var(--black);
            background: var(--off-white);
        }

        .option.selected {
            border-color: var(--black);
            background: var(--black);
            color: var(--white);
        }

        .option-letter {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 300;
            width: 32px;
            height: 32px;
            border: 1px solid currentColor;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option.selected .option-letter {
            border-color: var(--white);
        }

        .option-text {
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
        }

        /* VISUAL OPTIONS (color swatches) */
        .option.visual-option {
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0;
            border: 2px solid transparent;
            background: none;
            gap: 0;
        }

        .option.visual-option:hover {
            border-color: var(--black);
            background: none;
        }

        .option.visual-option.selected {
            border-color: var(--black);
            background: none;
            color: var(--black);
        }

        .swatch-group {
            width: 100%;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            overflow: hidden;
        }

        .visual-option .option-label {
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 14px 8px;
            font-weight: 500;
        }

        /* NAVIGATION */
        .quiz-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 56px;
            padding-top: 32px;
            border-top: 1px solid var(--warm-gray);
        }

        .nav-btn {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 32px;
            border: 1px solid var(--black);
            background: transparent;
            color: var(--black);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--black);
            color: var(--white);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
        }

        .nav-btn.primary {
            background: var(--black);
            color: var(--white);
        }

        .nav-btn.primary:hover {
            background: var(--dark-gray);
        }

        /* RESULTS */
        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .result-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 24px;
            position: relative;
            overflow: hidden;
        }

        .result-hero .reveal-label {
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--mid-gray);
            margin-bottom: 24px;
            animation: fadeUp 0.8s ease 0.2s both;
        }

        .result-hero .season-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(52px, 10vw, 120px);
            font-weight: 400;
            line-height: 1;
            margin-bottom: 8px;
            animation: fadeUp 0.8s ease 0.4s both;
        }

        .result-hero .season-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 300;
            font-style: italic;
            color: var(--dark-gray);
            margin-bottom: 48px;
            animation: fadeUp 0.8s ease 0.6s both;
        }

        .result-palette {
            display: flex;
            gap: 4px;
            margin-bottom: 48px;
            animation: fadeUp 0.8s ease 0.8s both;
        }

        .result-palette .color {
            width: 48px;
            height: 64px;
            transition: transform 0.3s ease;
        }

        .result-palette .color:first-child {
            border-radius: 24px 0 0 24px;
        }

        .result-palette .color:last-child {
            border-radius: 0 24px 24px 0;
        }

        .result-palette .color:hover {
            transform: scaleY(1.15);
        }

        .result-description {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(18px, 2.2vw, 22px);
            font-weight: 300;
            line-height: 1.8;
            max-width: 600px;
            color: var(--dark-gray);
            animation: fadeUp 0.8s ease 1s both;
        }

        /* RESULT DETAILS */
        .result-details {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 24px 120px;
        }

        .detail-section {
            margin-bottom: 80px;
        }

        .detail-section-label {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--mid-gray);
            margin-bottom: 20px;
        }

        .detail-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 24px;
        }

        .detail-section p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 19px;
            line-height: 1.8;
            color: var(--dark-gray);
            max-width: 640px;
        }

        /* COLOR PALETTE DETAIL */
        .palette-detail {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 16px;
            margin-top: 32px;
        }

        .palette-item {
            text-align: center;
        }

        .palette-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }

        .palette-swatch:hover {
            transform: scale(1.08);
        }

        .palette-name {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--dark-gray);
        }

        /* CELEBRITY GRID */
        .celeb-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .celeb-tag {
            font-size: 13px;
            padding: 8px 20px;
            border: 1px solid var(--warm-gray);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
        }

        /* AVOID COLORS */
        .avoid-palette {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .avoid-swatch {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            position: relative;
            opacity: 0.7;
        }

        .avoid-swatch::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -2px;
            right: -2px;
            height: 2px;
            background: var(--black);
            transform: rotate(-45deg);
        }

        /* RETAKE BUTTON */
        .retake-section {
            text-align: center;
            padding: 80px 24px;
            border-top: 1px solid var(--warm-gray);
        }

        .retake-section p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            color: var(--mid-gray);
            font-style: italic;
            margin-bottom: 32px;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 40px 24px;
            border-top: 1px solid var(--warm-gray);
        }

        footer p {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--mid-gray);
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            nav { padding: 0 24px; }
            .options-grid.visual { grid-template-columns: repeat(2, 1fr); }
            .result-palette .color { width: 36px; height: 52px; }
            .palette-detail { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">Colour Analysis</div>
</nav>

<!-- HERO -->
<section class="hero" id="hero">
    <div class="hero-label">The definitive quiz</div>
    <h1>What <em>Season</em><br>Are You?</h1>
    <p class="hero-subtitle">
        Discover the palette that was made for you. Seven questions stand between you and the colors that will transform your wardrobe forever.
    </p>
    <button class="cta-button" onclick="startQuiz()">Begin the Analysis</button>
</section>

<div class="season-strip"><div></div><div></div><div></div><div></div></div>

<!-- QUIZ -->
<section class="quiz-section" id="quiz">
    <div class="quiz-container">
        <div class="progress-wrapper">
            <div class="progress-meta">
                <span class="progress-label">Your analysis</span>
                <span class="progress-count" id="progressCount">1 / 7</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 14.28%"></div>
            </div>
        </div>
        <div id="questionArea"></div>
        <div class="quiz-nav">
            <button class="nav-btn" id="prevBtn" onclick="prevQuestion()" disabled>Back</button>
            <button class="nav-btn primary" id="nextBtn" onclick="nextQuestion()" disabled>Continue</button>
        </div>
    </div>
</section>

<!-- RESULTS -->
<section class="results-section" id="results"></section>

<footer>
    <p>Colour Analysis &mdash; A Study in Personal Colour</p>
</footer>

<script>

    spring: {
        title: 'Spring',
        subtitle: 'Warm, bright, and irresistibly fresh',
        description: 'You are a Spring\u2014your colouring has the luminous warmth of the first days of the season. Your palette is alive: think daffodil yellow, coral, warm peach, and grass green. You radiate energy and freshness, and your best colours mirror that vitality.',

let currentQuestion = 0;
let answers = {};

function startQuiz() {
    document.getElementById('hero').style.display = 'none';
    document.querySelector('.season-strip').style.display = 'none';
    const quiz = document.getElementById('quiz');
    quiz.classList.add('active');
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
    const q = questions[currentQuestion];
    const area = document.getElementById('questionArea');
    const isVisual = q.type === 'visual';

    let optionsHTML = '';
    q.options.forEach(opt => {
        const selected = answers[q.id] === opt.value ? ' selected' : '';
        if (isVisual) {
            const swatches = opt.colors.map(c => `<div style="background:${c}"></div>`).join('');
            optionsHTML += `
                <div class="option visual-option${selected}" onclick="selectOption('${q.id}', '${opt.value}', this)">
                    <div class="swatch-group">${swatches}</div>
                    <div class="option-label">${opt.text}</div>
                </div>`;
        } else {
            optionsHTML += `
                <div class="option${selected}" onclick="selectOption('${q.id}', '${opt.value}', this)">
                    <span class="option-letter">${opt.letter}</span>
                    <span class="option-text">${opt.text}</span>
                </div>`;
        }
    });

    area.innerHTML = `
        <div class="question-block" key="${q.id}">
            <div class="question-number">Question ${currentQuestion + 1}</div>
            <h2 class="question-text">${q.question}</h2>
            <p class="question-hint">${q.hint}</p>
            <div class="options-grid${isVisual ? ' visual' : ''}">${optionsHTML}</div>
        </div>`;

    document.getElementById('progressCount').textContent = `${currentQuestion + 1} / ${questions.length}`;
    document.getElementById('progressFill').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
    document.getElementById('prevBtn').disabled = currentQuestion === 0;

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.disabled = !answers[q.id];
    nextBtn.textContent = currentQuestion === questions.length - 1 ? 'See Results' : 'Continue';
}

function selectOption(questionId, value, el) {
    answers[questionId] = value;
    el.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
        document.getElementById('quiz').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
        showResults();
    }
}

function prevQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
    }
}

function calculateSeason() {
    let scores = { spring: 0, summer: 0, autumn: 0, winter: 0 };
    const mapping = {
        'warm': { spring: 2, autumn: 1 },
        'warm-light': { spring: 3 },
        'warm-deep': { autumn: 3 },
        'cool': { summer: 2, winter: 1 },
        'cool-light': { summer: 3 },
        'cool-soft': { summer: 3 },
        'cool-deep': { winter: 3 },
        'neutral': { summer: 1, spring: 1 },
        'spring': { spring: 4 },
        'summer': { summer: 4 },
        'autumn': { autumn: 4 },
        'winter': { winter: 4 }
    };

    Object.values(answers).forEach(val => {
        const m = mapping[val];
        if (m) {
            Object.entries(m).forEach(([season, pts]) => {
                scores[season] += pts;
            });
        }
    });

    return Object.entries(scores).reduce((a, b) => a[1] > b[1] ? a : b)[0];
}

function showResults() {
    const season = calculateSeason();
    const data = seasonData[season];

    document.getElementById('quiz').classList.remove('active');

    const paletteStrip = data.heroColors.map(c => `<div class="color" style="background:${c}"></div>`).join('');

        </div>

            <div class="detail-section">

                <div class="celeb-list">${celebTags}</div>

        </div>

        <div class="retake-section">
            <p>Not quite right? The best analysis is always done in person with draping.</p>
            <button class="cta-button" onclick="retakeQuiz()">Retake the Quiz</button>

    results.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function retakeQuiz() {
    currentQuestion = 0;
    answers = {};
    document.getElementById('results').classList.remove('active');
    document.getElementById('results').innerHTML = '';
    document.getElementById('hero').style.display = '';
    document.querySelector('.season-strip').style.display = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
